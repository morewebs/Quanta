[package]
name = "quanta"
version = "0.1.0"
description = "Local-first notes with Telegram as the cloud"
authors = ["Quanta"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "quanta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
thiserror = "2"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
grammers-client = { git = "https://codeberg.org/Lonami/grammers.git" }
grammers-session = { git = "https://codeberg.org/Lonami/grammers.git" }
grammers-mtsender = { git = "https://codeberg.org/Lonami/grammers.git" }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
